name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Pinned: formatter output can change between SDK releases.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      # Resolve packages so each analysis_options.yaml (page_width) and SDK version is honoured.
      - run: |
          for p in $(git ls-files '*pubspec.yaml' | xargs -n1 dirname); do
            (cd "$p" && flutter pub get) || exit 1
          done
      - run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
