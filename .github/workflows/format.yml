name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: formatter output can change between SDK releases.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart format --output=none --set-exit-if-changed .
