name: carp_mobile_sensing_app
description: The CARP Mobile Sensing App
version: 2.0.0
homepage: https://github.com/cph-cachet/carp.sensing-flutter/tree/master/apps/carp_mobile_sensing_app
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

  # CARP libraries. The local copies are used, see dependency_overrides below.
  carp_serializable: ^3.0.1
  carp_core: ^3.0.0
  carp_mobile_sensing: ^3.0.0
  carp_webservices: ^5.0.0
  carp_backend: ^3.0.0

  # CARP sampling packages
  carp_apps_package: ^2.1.0
  carp_audio_package: ^2.1.1
  carp_communication_package: ^2.1.0
  carp_connectivity_package: ^2.2.1
  carp_context_package: ^2.2.0
  carp_esense_package: ^2.1.0
  carp_health_package: ^4.1.1
  carp_movesense_package: ^4.0.0
  carp_movisens_package: ^2.2.0
  carp_polar_package: ^2.1.0
  # iOS only - collects data from an Apple Watch via the AWARE watchOS framework.
  # Needs the companion watchOS app, see packages/carp_aware_package/doc/watchos_app_setup.md
  carp_aware_package: ^1.2.0

  # Plugins the app itself uses. The plugins used by the CARP packages come with them.
  permission_handler: '>=11.0.0 <13.0.0'
  flutter_reactive_ble: ^5.0.0
  shared_preferences: ^2.2.0

# Overriding carp libraries to use the local copy
dependency_overrides:
  carp_serializable:
    path: ../../carp_serializable/
  carp_core:
    path: ../../carp_core/
  carp_mobile_sensing:
    path: ../../carp_mobile_sensing/
  carp_context_package:
    path: ../../packages/carp_context_package/
  carp_connectivity_package:
    path: ../../packages/carp_connectivity_package/
  carp_communication_package:
    path: ../../packages/carp_communication_package/
  carp_audio_package:
    path: ../../packages/carp_audio_package/
  carp_apps_package:
    path: ../../packages/carp_apps_package/
  carp_esense_package:
    path: ../../packages/carp_esense_package/
  carp_polar_package:
    path: ../../packages/carp_polar_package/
  carp_movisens_package:
    path: ../../packages/carp_movisens_package/
  carp_health_package:
    path: ../../packages/carp_health_package/
  carp_backend:
    path: ../../backends/carp_backend/
  carp_webservices:
    path: ../../backends/carp_webservices/
  carp_movesense_package:
    path: ../../packages/carp_movesense_package/
  # carp_cortrium_package:
  #   path: ../../../carp_cortrium_package/
  carp_aware_package:
    path: ../../packages/carp_aware_package/

  # research_package:
  #   path: ../../../../research.package/

  # esense_flutter:
  #   path: ../../../../flutter-plugins/packages/esense_flutter/

  # location:
  #   git:
  #     url: https://github.com/fairuzmn/flutterlocation.git
  #     ref: location-v5.5.0.0-dev.9-fix
  #     path: packages/location


  # due to this issue https://github.com/petri-lipponen-movesense/mdsflutter/issues/36
  # mdsflutter:
  #   git:
  #     url: https://github.com/Panosfunk/mdsflutter.git
  #     ref: master

  # polar: 7.7.1
  # load polar from https://github.com/iarata/polar due to device_info_plus conflict
  # polar:
  #   git:
  #     url: https://github.com/iarata/polar.git
  #     ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: any
  flutter_lints: any
  flutter_launcher_icons: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Is used to change the default app launch icons on iOS and Android.
# To install:
#  1. add the 'flutter_launcher_icons' package to dev_dependencies above
#  2. add the 'flutter_icons:' section below
#  3. run 'flutter pub get'
#  3. run 'flutter pub pub run flutter_launcher_icons:main'
flutter_icons:
  android: true
  ios: true
  image_path: "assets/cachet_logo.png"


# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/study.png
    - assets/cachet_logo.png
    - assets/logo.png
