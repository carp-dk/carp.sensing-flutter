name: carp_connectivity_package_example
description: Examples of how to use the CANS Connectivity Package.
version: 1.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  carp_core: ^1.8.0
  carp_mobile_sensing: ^1.10.0
  
dependency_overrides:
  carp_core:
    path: ../../../carp_core/
  carp_mobile_sensing:
    path: ../../../carp_mobile_sensing
  carp_connectivity_package:
    path: ../

dev_dependencies:

