name: carp_survey_package_example
description: Examples of how to use the carp_survey_package.
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  carp_core: ^2.2.0
  carp_mobile_sensing: ^2.3.0
  carp_survey_package:
    path: ../
  research_package: ^4.0.0
  cognition_package: ^1.10.1

# Overriding carp libraries to use the local copy
# Remove this before release of package
dependency_overrides:
  # carp_serializable:
  #   path: ../../carp_serializable/
  carp_core:
    path: ../../../carp_core/
  carp_mobile_sensing:
    path: ../../../carp_mobile_sensing/
dev_dependencies:
  flutter_lints: any
